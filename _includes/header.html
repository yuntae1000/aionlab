<header class="site-header">
  <div class="shell header-inner">
    <div class="identity-lockup">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="AION Lab home">
        <img class="brand-mark" src="{{ '/assets/images/aionlab-mark-renewed.png' | relative_url }}" alt="" width="58" height="58">
        <span class="brand-name">AION <small>Lab</small></span>
      </a>
      <span class="identity-divider" aria-hidden="true"></span>
      <img class="khu-mark" src="{{ '/assets/images/khu-logo-official.png' | relative_url }}" alt="Kyung Hee University" width="79" height="57">
    </div>

    <nav class="site-nav" aria-label="Primary navigation">
      <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Toggle navigation">
      <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true"><span></span><span></span><span></span></label>
      <div class="nav-links">
        <a href="{{ '/research' | relative_url }}"{% if page.url contains '/research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/publications' | relative_url }}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publication</a>
        <a href="{{ '/people/' | relative_url }}"{% if page.url contains '/people' %} aria-current="page"{% endif %}>People</a>
        <a href="{{ '/talks' | relative_url }}"{% if page.url contains '/talks' %} aria-current="page"{% endif %}>Talks</a>
        <a href="{{ '/photos' | relative_url }}"{% if page.url contains '/photos' %} aria-current="page"{% endif %}>Photo</a>
        <a href="{{ '/contact' | relative_url }}"{% if page.url contains '/contact' %} aria-current="page"{% endif %}>Contact</a>
      </div>
    </nav>
  </div>
</header>
