<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1930">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% if page.body_class == 'professor-page' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": "Yoontae (Jake) Jung",
      "alternateName": ["Yoontae Jung", "Jake Jung", "정윤태"],
      "jobTitle": "Assistant Professor",
      "affiliation": { "@type": "CollegeOrUniversity", "name": "Kyung Hee University" },
      "image": "{{ '/assets/people/jake.jpg' | absolute_url }}",
      "sameAs": ["https://scholar.google.co.kr/citations?user=oYBU_jkAAAAJ&hl=en"]
    }
  }
  </script>
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
